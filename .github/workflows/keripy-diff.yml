# keripy-diff — nightly behavioral-parity check vs keripy.
#
# Regenerates the differential-test corpus from a PINNED keripy checkout and
# runs the in-crate diff harness against it. Unlike keripy-sync (which tracks
# the latest tag for code-table coverage), differential testing needs a FIXED
# oracle so a byte disagreement is unambiguous. A change to the regenerated
# corpus, or a harness failure, opens a PR for human review.
name: keripy-diff

on:
  schedule:
    # Nightly, 04:23 UTC (off-peak; fixed time for reproducibility).
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      verify_only:
        description: "Run parity checks without opening a corpus PR"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: keripy-diff
  cancel-in-progress: false

jobs:
  diff:
    name: Differential parity vs keripy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cesr
        uses: actions/checkout@v4

      # The pinned keripy oracle commit lives in scripts/KERIPY_PIN (single source
      # of truth). Bump deliberately, in lockstep with the corpus.
      - name: Resolve keripy pin
        run: |
          ref="$(cat scripts/KERIPY_PIN)"
          if [ "$(wc -l < scripts/KERIPY_PIN)" -ne 1 ] \
            || ! printf '%s' "$ref" | grep -qxE '[0-9a-f]{40}'; then
            echo "malformed scripts/KERIPY_PIN: expected exactly one 40-char lowercase hex commit sha line" >&2
            exit 1
          fi
          echo "KERIPY_REF=$ref" >> "$GITHUB_ENV"

      - name: Clone keripy at the pinned commit
        run: |
          git init /tmp/keripy
          git -C /tmp/keripy remote add origin https://github.com/WebOfTrust/keripy
          git -C /tmp/keripy fetch --depth 1 origin "${KERIPY_REF}"
          git -C /tmp/keripy checkout FETCH_HEAD
          test "$(git -C /tmp/keripy rev-parse HEAD)" = "${KERIPY_REF}"

      # keripy at the pin requires Python >= 3.14.0.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # pysodium (a keripy dep) dlopen's the native libsodium shared library.
      - name: Install libsodium
        run: sudo apt-get update && sudo apt-get install -y libsodium23

      - name: Install keripy and independent vector dependencies
        # keripy uses pysodium; our deterministic TEL/ACDC/IPEX generators
        # additionally import nacl.signing, which keripy does not install.
        run: |
          python -m pip install -e /tmp/keripy 'PyNaCl==1.6.2'
          python -c 'from nacl.signing import SigningKey; import blake3'

      - name: Regenerate corpus
        run: |
          python scripts/keripy_diff_gen.py --keripy /tmp/keripy --out crates/cesr-stream/tests/corpus/keripy
          python scripts/keripy_parity_gen.py --keripy /tmp/keripy --out crates/keri-codec/tests/corpus/keripy/parity
          python scripts/keripy_events_gen.py --keripy /tmp/keripy --out crates/keri-codec/tests/corpus/keripy/parity --kels-out crates/keri-codec/tests/corpus/kels.jsonl
          python scripts/keripy_receipts_gen.py --keripy /tmp/keripy --out crates/keri-codec/tests/corpus/keripy/parity
          # The TEL generator reproduces shapes; the imported-keripy commands
          # below independently check its factory bytes and state outcomes.
          python scripts/keripy_tel_gen.py --out-dir crates/keri-codec/tests/corpus/tel
          # Independent imported-keripy TEL factory, reader, signature and
          # Tevery checks; these fail if reproduced bytes or verdicts drift.
          KERIPY_CHECKOUT=/tmp/keripy PYTHONPATH=/tmp/keripy python scripts/keripy_tel_oracle.py
          PYTHONPATH=/tmp/keripy python docs/audits/2026-09-29-a07-oracle.py
          python scripts/keripy_acdc_gen.py --out-dir crates/keri-codec/tests/corpus/acdc
          KERIPY_CHECKOUT=/tmp/keripy PYTHONPATH=/tmp/keripy python scripts/keripy_acdc_oracle.py
          # `credential` factory comparisons for ACDC escaped/numeric payloads.
          PYTHONPATH=/tmp/keripy python docs/audits/2026-09-29-a09-oracle.py
          python scripts/keripy_ipex_gen.py --out-dir crates/keri-codec/tests/corpus/ipex
          KERIPY_CHECKOUT=/tmp/keripy PYTHONPATH=/tmp/keripy python scripts/keripy_ipex_oracle.py
          KERIPY_CHECKOUT=/tmp/keripy PYTHONPATH=/tmp/keripy python scripts/keripy_credential_oracle.py
          KERIPY_CHECKOUT=/tmp/keripy PYTHONPATH=/tmp/keripy python scripts/keripy_ipex_flow_oracle.py
          git --no-pager diff --stat -- crates/cesr-stream/tests/corpus crates/keri-codec/tests/corpus || true

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Run differential harness against the fresh corpus
        run: |
          nix develop --command bash -euo pipefail <<'BASH'
          cargo test --all-features keripy -- --nocapture
          # Cargo filters test names, not integration-test filenames. Pin the
          # complete binary selection so a missing suite cannot pass as zero tests.
          for suite in \
            keripy_tel:5 keripy_acdc:5 keripy_ipex:7 \
            keripy_receipts:2 keripy_json_payload:6 \
            keripy_custody:1 keripy_duplicity:1 keripy_delegation:1 \
            keripy_semantics:3 a27_credential:3 a28_ipex:2; do
            binary="${suite%%:*}"
            expected="${suite##*:}"
            selected="$(cargo test -p keri-codec --all-features --test "$binary" -- --list 2>&1 | awk '/: test$/ { n++ } END { print n+0 }')"
            echo "$binary: selected $selected tests (expected $expected)"
            test "$selected" -eq "$expected"
            cargo test -p keri-codec --all-features --test "$binary" -- --nocapture
          done
          BASH

      # An App-authored PR (vs the default GITHUB_TOKEN) lets the required
      # `Nix Flake Check` run on it, and sign-commits satisfies the signed-commits
      # branch rule. Reuses the release-plz App (as keripy-sync does).
      - name: Mint App token
        id: app-token
        if: ${{ !inputs.verify_only }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}

      - name: Open/update corpus-drift PR
        if: ${{ !inputs.verify_only }}
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: keripy-diff/corpus
          base: main
          sign-commits: true
          commit-message: "test(diff): refresh keripy differential corpus"
          title: "test(diff): keripy differential corpus refresh"
          body: |
            Nightly **keripy-diff** regenerated the corpus from keripy `${{ env.KERIPY_REF }}`.

            Covers the primitive differential corpus AND the parity families
            (`parity/codex.jsonl`, `parity/formulas.jsonl`,
            `parity/validation.jsonl`, `parity/events.jsonl`), plus the TEL,
            ACDC and IPEX corpora. Imported pinned-keripy oracles verify
            factory bytes, signatures, readers and selected state verdicts;
            explicit Rust test-binary counts guard against empty selection.
            A changed reference byte or verdict fails the job.

            A non-empty diff means keripy's output moved or the generator surfaced
            new coverage — review the vector delta before merging. If the harness
            step failed, a real cesr↔keripy disagreement exists: do **not** merge;
            file a bug and fix cesr (or `#[ignore]` the case with a tracking issue).
          labels: keripy-diff
          delete-branch: false
