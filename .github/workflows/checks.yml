name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Nix Flake Check
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Resolve every independent Cargo workspace with its committed lock.
      # The Nix replay exercises fuzz/, while these metadata calls also catch
      # stale transitive entries in fuzz-common/ and fuzz-afl/ without building
      # their fuzzing engines.
      - name: Resolve all Cargo locks
        run: |
          cargo metadata --locked --format-version 1 --manifest-path Cargo.toml > /dev/null
          cargo metadata --locked --format-version 1 --manifest-path fuzz-common/Cargo.toml > /dev/null
          cargo metadata --locked --format-version 1 --manifest-path fuzz/Cargo.toml > /dev/null
          cargo metadata --locked --format-version 1 --manifest-path fuzz-afl/Cargo.toml > /dev/null

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            keep-env-derivations = true
            keep-outputs = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          # GitHub caches are immutable. Save each validated revision, preferring
          # a previous build with the same dependencies when restoring.
          primary-key: nix-ci-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', 'flake.nix', 'flake.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-prefixes-first-match: |
            nix-ci-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', 'flake.nix', 'flake.lock', 'rust-toolchain.toml') }}-
            nix-ci-${{ runner.os }}-${{ runner.arch }}-
          gc-max-store-size-linux: 1G
          purge: true
          purge-prefixes: nix-ci-${{ runner.os }}-${{ runner.arch }}-
          purge-created: 0
          purge-primary-key: never

      # The single CI gate. `nix flake check` builds every check in flake.nix —
      # including cesr-nextest (the entire test suite) and
      # cesr-doctest (the doc-comment examples, which nextest does not run).
      # `-L` (--print-build-logs) streams FULL build logs instead of nix's
      # truncated "last 25 lines" on a failed derivation — essential for
      # diagnosing a failing test.
      - name: Flake Check
        run: nix flake check -L

      # flake check creates no GC roots. Root its successful outputs so cache
      # cleanup preserves them and their build dependencies (keep-outputs above).
      - name: Keep validated checks in the cache
        run: |
          mkdir -p .nix-ci
          nix build --out-link .nix-ci/check --impure --expr \
            'let flake = builtins.getFlake ("git+file://" + toString ./.); in builtins.attrValues (builtins.getAttr builtins.currentSystem flake.checks)'
