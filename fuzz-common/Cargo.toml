# Shared fuzz-target bodies, consumed by both the Bolero crate (fuzz/) and
# the AFL++ crate (fuzz-afl/). Its own workspace root avoids implicit
# membership in the five-crate release workspace. It depends on CESR crates
# but no fuzzing engine, so the stable `cesr-fuzz-replay` check can use it.
[workspace]

[package]
name = "fuzz-common"
version = "0.0.0"
edition = "2024"
rust-version = "1.95.0"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
cesr = { package = "cesr-rs", path = "../crates/cesr", features = ["core"] }
cesr-stream = { path = "../crates/cesr-stream" }
keri-codec = { path = "../crates/keri-codec" }
keri-events = { path = "../crates/keri-events" }
