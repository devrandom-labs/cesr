[package]
name = "keri-codec"
version = "0.10.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "KERI event codec: events <-> canonical JSON, SAID computation, and CESR message framing. Under active development."
categories = ["cryptography", "encoding", "no-std"]
keywords = ["keri", "cesr", "identity", "cryptography"]
# These repository integration tests use the path-only `keri-rs` dev dependency.
# `keri-rs` depends on this crate, so publishing that dev edge by version would
# make the coordinated release graph cyclic. Keep the tests in the checkout
# and in the full workspace gate; ship only self-contained codec tests.
exclude = [
    "tests/a10_auth_work.rs",
    "tests/a15_baseline.rs",
    "tests/a26_discovery.rs",
    "tests/a27_credential.rs",
    "tests/a28_ipex.rs",
    "tests/custody_chain.rs",
    "tests/delegation.rs",
    "tests/differential.rs",
    "tests/duplicity.rs",
    "tests/inception_identity.rs",
    "tests/keripy_acdc.rs",
    "tests/keripy_custody.rs",
    "tests/keripy_delegation.rs",
    "tests/keripy_duplicity.rs",
    "tests/keripy_ipex.rs",
    "tests/keripy_json_payload.rs",
    "tests/keripy_receipts.rs",
    "tests/keripy_semantics.rs",
    "tests/keripy_tel.rs",
    "tests/message_allocation.rs",
    "tests/properties.rs",
    "tests/registry_fold.rs",
    "tests/review_numeric.jsonl",
    "tests/review_security.rs",
    "tests/snapshot.rs",
    "tests/spine.rs",
    "tests/spine_write.rs",
    "tests/transitions.rs",
    "tests/common/**",
]

[features]
default = ["std"]
std = ["alloc", "cesr/std", "cesr-stream/std", "keri-events/std", "thiserror/std", "dep:jsonschema", "dep:serde_json"]
alloc = ["cesr/alloc", "cesr-stream/alloc", "keri-events/alloc"]

[dependencies]
bytes = { version = "1.10.1", default-features = false }
cesr = { package = "cesr-rs", path = "../cesr", version = "0.12", default-features = false, features = [
    "core",
    "b64",
    "crypto",
] }
cesr-stream = { path = "../cesr-stream", version = "0.7", default-features = false }
jsonschema = { version = "=0.49.7", default-features = false, features = ["arbitrary-precision"], optional = true }
keri-events = { path = "../keri-events", version = "0.6", default-features = false }
serde_json = { version = "1.0.149", default-features = false, features = [
    "std",
    "float_roundtrip",
    "arbitrary_precision",
], optional = true }
thiserror = { workspace = true }

[dev-dependencies]
base64 = { version = "0.22.1", default-features = false, features = ["alloc"] }
cesr = { package = "cesr-rs", path = "../cesr", version = "0.12", default-features = false, features = [
    "std",
] }
cesr-stream = { path = "../cesr-stream", version = "0.7", features = ["async"] }
criterion = { version = "5.0.1", package = "codspeed-criterion-compat", default-features = false, features = [
    "cargo_bench_support",
] }
keri = { package = "keri-rs", path = "../keri", default-features = false, features = [
    "credential-verification",
] }
proptest = "1.10.0"
rstest = "0.26.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["float_roundtrip", "preserve_order", "raw_value"] }

[[bench]]
name = "serder"
harness = false

[[bench]]
name = "message"
harness = false

[lints]
workspace = true
