[package]
name = "keri-rs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Sans-IO KERI (Key Event Receipt Infrastructure) core built on cesr-rs. Under active development."
categories = ["cryptography", "no-std"]
keywords = ["keri", "cesr", "identity", "cryptography"]

[lib]
# Import name is `keri` regardless of the published `keri-rs` package name.
name = "keri"

[features]
default = ["std"]
std = ["cesr/std", "keri-events/std"]
alloc = ["cesr/alloc", "keri-events/alloc", "keri-codec?/alloc"]
# Optional wire-edge adapter (the #128 "optional edge"): enables the
# `keri-codec` crate so a parsed `keri_codec::EventMessage` converts straight
# into `Signed`. Default features retain the sans-io core: it verifies exact
# supplied bytes but does not parse the wire or depend on `keri-codec`.
wire = ["dep:keri-codec", "alloc"]
# Schema and transitive chain verification is a separate opt-in edge. The
# default core and ordinary wire feature do not pull JSON Schema dependencies.
credential-verification = ["std", "wire", "keri-codec/std", "dep:serde_json"]

[dependencies]
# PUBLIC API ONLY. Must NOT enable cesr's `internals` or `test-utils` features
# (the only back-doors to non-public items). Enforced by the flake boundary check.
# The `wire` feature may enable `keri-codec` (still public API only).
cesr = { package = "cesr-rs", path = "../cesr", version = "0.12", default-features = false, features = [
    "core",
    "crypto",
    "alloc",
] }
keri-codec = { path = "../keri-codec", version = "0.10", default-features = false, optional = true }
# keri-events uses Vec/String unconditionally, so it requires `alloc` to compile;
# hardcode it here (matching the cesr dep) so the sans-io no-default-features
# build still supplies it. Not `internals` — that stays out (boundary check).
keri-events = { path = "../keri-events", version = "0.6", default-features = false, features = [
    "alloc",
] }
serde_json = { version = "1.0.149", default-features = false, features = ["std"], optional = true }
thiserror = { workspace = true }

[dev-dependencies]
base64 = { version = "0.22.1", default-features = false, features = ["alloc"] }
cesr = { package = "cesr-rs", path = "../cesr", default-features = false, features = [
    "std",
    "core",
    "crypto",
] }
# dev-only: the direct_mode example frames events (keri-codec) and needs
# cesr-stream's `ControllerIdxSigs` group for `frame_v1`. The version keeps
# this dependency in the normalized manifest of the published crate.
cesr-stream = { path = "../cesr-stream", version = "0.7", default-features = false, features = ["std"] }
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.149", default-features = false, features = ["alloc"] }

# proptest's default features pull rusty-fork/wait-timeout, which do not
# compile on wasm32-unknown-unknown — so the direct_mode example could not be
# wasm-checked with it in the shared dev-dependency graph. Tests never run on
# wasm; scope proptest (and its graph) to real test platforms.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = "1"

[[example]]
name = "direct_mode"
required-features = ["wire"]

[lints]
workspace = true
